# Free web service reusing an existing PostgreSQL database. No paid resources.
# RENDER_EXTERNAL_URL supplies the HTTPS origin; do not copy local origin values.
services:
  - type: web
    name: perkpilot
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.8.0
      - key: PERKPILOT_MODE
        value: demo
      - key: PERKPILOT_PORTAL_STORAGE
        value: postgres
      - key: PERKPILOT_DATABASE_SCHEMA
        value: perkpilot_hosted
      - key: PERKPILOT_CHECKOUT_ENABLED
        value: "0"
      - key: PERKPILOT_CHECKOUT_DEMO_CONTROLS
        value: "0"
      # Enable checkout after adding the allocated URL's STRIPE_WEBHOOK_SECRET.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_EXPECTED_ACCOUNT_ID
        sync: false
      - key: GEMINI_CHECKOUT_MODEL
        value: gemini-3.7-flash
      - key: DATABASE_URL
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SERPAPI_API_KEY
        sync: false
      - key: SERPAPI_LOCATION
        value: United States
      - key: SERPAPI_GL
        value: us
      - key: SERPAPI_HL
        value: en
